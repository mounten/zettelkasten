[package]
name = "zettelkasten"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.7.0", features = [
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-html",
    "tree-sitter-css",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-yaml",
    "tree-sitter-lua",
    "tree-sitter-markdown",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
serde_yaml = "0.9"
# Already used by gpui; re-encodes pasted bitmaps as PNG.
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff", "ico", "pnm"] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
resvg = "0.45"

[build-dependencies]
embed-resource = "3"
